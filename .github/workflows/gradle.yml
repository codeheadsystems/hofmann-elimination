# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hofmann-typescript/package-lock.json

      # The Java <-> TypeScript cross-client tests in :hofmann-integration-tests call
      # assumeThat(TypeScriptRunner.isTypeScriptAvailable()), which requires both
      # node_modules and dist under hofmann-typescript. Without this step they skip
      # themselves and the build still reports green, so build the client first to make
      # that coverage real.
      - name: Build the TypeScript client for the cross-client tests
        run: npm ci && npm run build
        working-directory: hofmann-typescript

      - name: Build with Gradle Wrapper
        run: ./gradlew build test

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
    #   with:
    #     gradle-version: '8.5'
    #
    # - name: Build with Gradle 8.5
    #   run: gradle build

  typescript:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hofmann-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hofmann-typescript

      - name: Typecheck
        run: npm run typecheck
        working-directory: hofmann-typescript

      - name: Build
        run: npm run build
        working-directory: hofmann-typescript

      - name: Test
        run: npm test
        working-directory: hofmann-typescript

      # Runs last, deliberately. Placed before typecheck/build/test it would mean an advisory in
      # vite or vitest hides whether the client actually works — the functional signal is the one
      # you cannot reconstruct from the logs. --audit-level=high rather than moderate for the same
      # reason the Gradle gate skips test configurations: a check that fires on every transitive
      # dev dependency gets ignored, and an ignored gate is the same as no gate.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: hofmann-typescript

  rust:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: hofmann-rust

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ubuntu-latest ships a stable Rust toolchain with cargo, rustfmt and clippy,
      # so there is no third-party toolchain action to pin here.
      - name: Show toolchain versions
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Cache cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            hofmann-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hofmann-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      # --locked fails if Cargo.lock is stale, which catches a manifest edit that was
      # committed without the matching lockfile update.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # RustSec's advisory database, checked against Cargo.lock. The version is pinned, which it
      # was not at first: `cargo install cargo-audit --locked` pins cargo-audit's own lockfile
      # *after* resolving "latest", so the binary itself floated. In a workflow that SHA-pins every
      # action specifically to avoid mutable tags, compiling ~200 crates fetched at HEAD-of-crates
      # .io next to a checkout of this repo was the softest target in the file. The argument I gave
      # for leaving it unpinned — that an advisory scanner should be newest — was also wrong: the
      # advisories come from the RustSec database at runtime, not from the binary, so a pinned
      # scanner is not a stale scanner.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

  dependency-scan:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Lifted to the job so the steps below can test it. The `secrets` context is not available in
    # a step-level `if` — only `env` is — so checking `secrets.NVD_API_KEY` directly there would
    # not have worked, and would have failed as a silently-skipped warning rather than loudly.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      # The NVD database is large and slow to build; caching it keeps this job to minutes rather
      # than tens of minutes. The key is dated to the ISO week, so the cache is rebuilt once a week
      # and cannot go stale enough to miss a recent advisory, while restore-keys gives a warm start
      # on the week's first run. It was keyed on github.run_id first, which is unique per run —
      # never a hit, and a fresh multi-hundred-megabyte save every time, which would have evicted
      # the gradle, npm and cargo caches out of the repository's cache budget.
      - name: Compute the weekly cache key
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-nvd-${{ steps.nvd-week.outputs.week }}
          restore-keys: ${{ runner.os }}-nvd-

      # NVD_API_KEY is REQUIRED. An earlier version of this job warned and carried on, on the
      # belief that without a key the scan runs rate-limited. It does not: dependency-check ships
      # nvd.api.key as an empty string rather than absent, which passes its own null check and goes
      # out as an empty apiKey header — and NVD answers that with 404 where it answers a missing
      # header with 200. The task then fails with "Invalid API Key, length of 0". So the choice is
      # between failing here with an explanation and failing twenty seconds later without one.
      # Get a key at https://nvd.nist.gov/developers/request-an-api-key.
      - name: Require an NVD API key
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::error::NVD_API_KEY is not set. OWASP Dependency-Check cannot reach the NVD"
          echo "::error::feed without one — it fails rather than degrading. Request a key at"
          echo "::error::https://nvd.nist.gov/developers/request-an-api-key and add it as the"
          echo "::error::repository secret NVD_API_KEY."
          exit 1

      # --no-parallel is required, not tidiness. gradle.properties sets org.gradle.parallel=true,
      # and dependencyCheckAggregate resolves other projects' configurations at execution time,
      # which Gradle 9 refuses under parallel execution ("attempted without an exclusive lock").
      # Without this the job fails in about ten seconds having scanned nothing — a permanently red
      # job, which decays into an ignored one, which is exactly what this was meant to replace.
      - name: Scan dependencies for known vulnerabilities
        run: ./gradlew --no-parallel dependencyCheckAggregate

      # Uploaded on failure so the CVE list is readable without re-running the scan locally, which
      # would mean rebuilding the NVD database on a developer machine. The path is the plugin's
      # actual output directory — reporting.baseDirectory/dependency-check — not the one directory
      # up that this first pointed at, where upload-artifact would have found nothing and, with its
      # default if-no-files-found: warn, said so only in passing.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.*

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
