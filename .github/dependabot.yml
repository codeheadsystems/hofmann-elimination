# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly" # Check for updates every week
      day: "tuesday"
    groups:
      # Specify a name for the group, which will be used in pull request titles
      # and branch names
      dev-dependencies:
        # Define patterns to include dependencies in the group (based on
        # dependency name)
        applies-to: version-updates # Applies the group rule to version updates
        patterns:
          - "*"       # Yolo!

  - package-ecosystem: "cargo"
    directory: "/hofmann-rust"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    # No version pins: as of v3.0.0 the crate is on the RustCrypto 0.14 line
    # (elliptic-curve/p256/p384/p521/hash2curve 0.14, sha2 0.11, hmac 0.13,
    # digest 0.11, rand/rand_core 0.10), so the whole set moves together.
    # Note that the curve crates and elliptic-curve must stay on the same
    # minor: bumping one alone puts two incompatible copies of elliptic-curve
    # in the tree and does not build (that was #71).

  - package-ecosystem: "npm"
    directory: "/hofmann-typescript"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

