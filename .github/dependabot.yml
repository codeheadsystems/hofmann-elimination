# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily" # Check for updates every day
    groups:
      # Specify a name for the group, which will be used in pull request titles
      # and branch names
      dev-dependencies:
        # Define patterns to include dependencies in the group (based on
        # dependency name)
        applies-to: version-updates # Applies the group rule to version updates
        patterns:
          - "*"       # Yolo!

  - package-ecosystem: "cargo"
    directory: "/hofmann-rust"
    schedule:
      interval: "daily"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    # RustCrypto ecosystem alignment: p256/p384/p521/elliptic-curve are still
    # on the 0.13 line, which depends on the older sha2/hmac/digest/hkdf/rand
    # majors. The 0.14 line of the curve crates only exists as -rc.* on
    # crates.io. Re-enable these once elliptic-curve 0.14 ships stable.
    # Tracking: watch https://github.com/RustCrypto/elliptic-curves/releases
    ignore:
      - dependency-name: "sha2"
        versions: [">=0.11"]
      - dependency-name: "hmac"
        versions: [">=0.13"]
      - dependency-name: "digest"
        versions: [">=0.11"]
      - dependency-name: "hkdf"
        versions: [">=0.13"]
      - dependency-name: "rand"
        versions: [">=0.9"]
      - dependency-name: "rand_core"
        versions: [">=0.7"]
      - dependency-name: "generic-array"
        versions: [">=1.0"]

  - package-ecosystem: "npm"
    directory: "/hofmann-typescript"
    schedule:
      interval: "daily"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

