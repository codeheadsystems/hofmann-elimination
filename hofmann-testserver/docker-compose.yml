services:
  hofmann:
    build:
      # Build context is the project root so the Dockerfile can access all modules
      context: ..
      dockerfile: hofmann-testserver/Dockerfile
    image: hofmann-testserver:latest
    ports:
      - "${HOFMANN_APP_PORT:-8080}:8080"
      - "${HOFMANN_ADMIN_PORT:-8081}:8081"
    environment:
      # Each variable is only forwarded to the container when it is set in the host environment.
      # There are no committed fallbacks — a fallback here would be a working key shared by every
      # deployment of the published image.
      #
      # With none of them set, config.yml's allowEphemeralKeys default takes over and the server
      # generates random keys at startup, so `docker compose up` works on a fresh clone. Every
      # registration is then lost on restart.
      #
      # Set these for keys that survive a restart:
      #   export SERVER_KEY_SEED_HEX=$(openssl rand -hex 32)
      #   export OPRF_SEED_HEX=$(openssl rand -hex 32)
      #   export OPRF_MASTER_KEY_HEX=$(openssl rand -hex 32)
      #   export JWT_SECRET_HEX=$(openssl rand -hex 32)
      #
      # Or export ALLOW_EPHEMERAL_KEYS=false to make the server refuse to start without them.
      - SERVER_KEY_SEED_HEX
      - OPRF_SEED_HEX
      - OPRF_MASTER_KEY_HEX
      - JWT_SECRET_HEX
      - ALLOW_EPHEMERAL_KEYS
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8081/healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
