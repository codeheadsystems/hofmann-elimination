# Hofmann Test Server – Dropwizard Configuration
#
# This configuration is intended for local developer testing only.
# In-memory credential and session stores are used; all data is lost on restart.
#
# Keys are stable across restarts by default so that clients can be developed
# against a consistent server.  Override any key via the corresponding
# environment variable (see docker-compose.yml).
#
# WARNING: Do NOT use this configuration in production.

server:
  applicationConnectors:
    - type: http
      port: 8080
  adminConnectors:
    - type: http
      port: 8081

logging:
  level: INFO

# ── OPAQUE ────────────────────────────────────────────────────────────────────

opaqueCipherSuite: P256_SHA256
context: hofmann-testserver

argon2MemoryKib: 65536
argon2Iterations: 3
argon2Parallelism: 1

# ── Key material ──────────────────────────────────────────────────────────────
#
# No committed defaults. Every value below MUST come from the environment.
#
# These files are copied into the published images, so a committed fallback is not a
# convenience — it is a working key that every deployment of that image shares. Anyone could
# mint valid tokens against a deployment that kept the old jwtSecretHex default, and forge
# registrations against the old serverKeySeedHex.
#
# Leaving them empty alone would only trade a known key for a silently random one, so the
# server now refuses to start without them unless allowEphemeralKeys is set. Generate with:
#
#     openssl rand -hex 32
#
# The `:-` is load-bearing: Dropwizard's substitutor is non-strict, so a bare ${VAR} for an unset
# variable is left as the literal text "${VAR}", which looks like a configured value. The
# fail-closed check would be skipped and startup would die in hex parsing instead, and the
# allowEphemeralKeys escape hatch below would never be reached. `${VAR:-}` yields empty, which is
# what both of those paths test for.
#
# This file is the local test server, so allowEphemeralKeys defaults to true: with no variables
# exported, the server generates random keys at startup and runs. That is what makes `docker
# compose up` work on a fresh clone. The cost is stated plainly in the startup warning — every
# registration is invalidated on restart, and two nodes cannot share credentials.
#
# Export the four variables to get stable keys, or set ALLOW_EPHEMERAL_KEYS=false to make the
# server fail closed when you have not.
allowEphemeralKeys: ${ALLOW_EPHEMERAL_KEYS:-true}
serverKeySeedHex: ${SERVER_KEY_SEED_HEX:-}
oprfSeedHex: ${OPRF_SEED_HEX:-}

# ── Standalone OPRF ───────────────────────────────────────────────────────────

oprfCipherSuite: P256_SHA256
oprfMasterKeyHex: ${OPRF_MASTER_KEY_HEX:-}
oprfProcessorId: hofmann-testserver

# ── JWT ───────────────────────────────────────────────────────────────────────

jwtSecretHex: ${JWT_SECRET_HEX:-}
jwtTtlSeconds: 3600
jwtIssuer: hofmann-testserver
