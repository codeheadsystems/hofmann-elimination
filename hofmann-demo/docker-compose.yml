services:

  server:
    build:
      # Build context is the project root so the Dockerfile can access all modules
      context: ..
      dockerfile: hofmann-demo/server/Dockerfile
    image: hofmann-demo-server:latest
    environment:
      # Each variable is only forwarded to the container when it is set in the host environment.
      # There are no committed fallbacks — a fallback here would be a working key shared by every
      # deployment of the published image.
      #
      # With none of them set, config.yml's allowEphemeralKeys default takes over and the server
      # generates random keys at startup, so `make up` works on a fresh clone. Every registration
      # is then lost on restart.
      #
      # Set these for keys that survive a restart:
      #   export SERVER_KEY_SEED_HEX=$(openssl rand -hex 32)
      #   export OPRF_SEED_HEX=$(openssl rand -hex 32)
      #   export OPRF_MASTER_KEY_HEX=$(openssl rand -hex 32)
      #   export JWT_SECRET_HEX=$(openssl rand -hex 32)
      #
      # Or export ALLOW_EPHEMERAL_KEYS=false to make the server refuse to start without them.
      - SERVER_KEY_SEED_HEX
      - OPRF_SEED_HEX
      - OPRF_MASTER_KEY_HEX
      - JWT_SECRET_HEX
      - ALLOW_EPHEMERAL_KEYS
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8081/healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  demo-ui:
    build:
      # Build context is the project root so the Dockerfile can access both
      # hofmann-typescript/ and hofmann-demo/demo-ui/
      context: ..
      dockerfile: hofmann-demo/demo-ui/Dockerfile
    image: hofmann-demo-ui:latest
    depends_on:
      server:
        condition: service_healthy

  haproxy:
    image: haproxy:3.0-alpine
    ports:
      - "${DEMO_PORT:-443}:443"
      - "${API_PORT:-8443}:8443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
    depends_on:
      server:
        condition: service_healthy
      demo-ui:
        condition: service_started
