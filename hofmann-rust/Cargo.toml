[package]
name = "hofmann-rfc"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of RFC 9380 (Hash-to-Curve), RFC 9497 (OPRF), and RFC 9807 (OPAQUE)"
license = "Apache-2.0"
repository = "https://github.com/wolpert/hofmann-elimination"
keywords = ["opaque", "oprf", "hash-to-curve", "pake", "cryptography"]
categories = ["cryptography"]

[dependencies]
# Elliptic curves (RustCrypto)
p256 = { version = "0.13", features = ["hash2curve", "arithmetic"] }
p384 = { version = "0.13", features = ["hash2curve", "arithmetic"] }
p521 = { version = "0.13", features = ["hash2curve", "arithmetic"] }
elliptic-curve = { version = "0.13", features = ["sec1", "hash2curve", "arithmetic"] }

# Hashing and MAC
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"

# HKDF
hkdf = "0.12"

# Argon2id
argon2 = "0.5"

# Random number generation
rand = "0.8"
rand_core = "0.6"

# Ristretto255 / Curve25519
curve25519-dalek = { version = "4", features = ["rand_core"] }

# Constant-time comparison
subtle = "2.6"

# Serialization helpers
generic-array = "0.14"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
