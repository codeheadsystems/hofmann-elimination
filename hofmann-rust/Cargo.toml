[package]
name = "hofmann-rfc"
version = "3.1.0"
edition = "2021"
description = "Rust implementation of RFC 9380 (Hash-to-Curve), RFC 9497 (OPRF), and RFC 9807 (OPAQUE)"
license = "Apache-2.0"
repository = "https://github.com/wolpert/hofmann-elimination"
keywords = ["opaque", "oprf", "hash-to-curve", "pake", "cryptography"]
categories = ["cryptography"]

[dependencies]
# Elliptic curves (RustCrypto)
p256 = { version = "0.14", features = ["group-digest", "arithmetic"] }
p384 = { version = "0.14", features = ["group-digest", "arithmetic"] }
p521 = { version = "0.14", features = ["group-digest", "arithmetic"] }
elliptic-curve = { version = "0.14", features = ["sec1", "arithmetic"] }
# hash-to-curve moved out of elliptic-curve into its own crate in 0.14
hash2curve = "0.14"

# Hashing and MAC
sha2 = "0.11"
hmac = "0.13"
digest = "0.11"

# Argon2id
argon2 = "0.5"

# Random number generation
rand = "0.10"
rand_core = "0.10"

# Ristretto255 / Curve25519
curve25519-dalek = { version = "5", features = ["rand_core"] }

# Constant-time comparison
subtle = "2.6"

# Serialization helpers
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
# Tests only. The RFC 9497 Appendix A vectors live in one JSON file shared with
# the Java implementation rather than transcribed per port — re-transcribing is
# how a port ends up testing a subset and passing. The shipped crate has no
# serialization dependency and none of this reaches it.
serde_json = "1"
