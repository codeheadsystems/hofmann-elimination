hofmann:
  context: "integration-test"
  # Use real Argon2id with low memory for fast integration tests.
  # 1024 KiB (1 MiB) is fast but exercises the full Argon2id code path.
  argon2-memory-kib: 1024
  argon2-iterations: 1
  argon2-parallelism: 1
  oprf-master-key-hex: "137564f38fb14059492bbab74f03624de228817bd877b74e6df5ac378878720e"
  # 66 bytes, matching Nsk's maximum across the supported suites (P-521). This seed derives the
  # server's long-term AKE private key, so the same argument applies as to the OPRF seed below:
  # the key can carry no more entropy than the seed it is derived from, and 32 bytes would cap a
  # 521-bit key at 256 bits. Unreachable either way, but there is no reason to leave the two seeds
  # in this one file inconsistent about it.
  server-key-seed-hex: "71c35fd9647f464e7288c68fabe22a07a0a062a3423a9d402e55c55b07d1dae3c4f80b1e6a95d27038fbc4e19a5d360782cbe4f19d0a63c85be27f4a1d90c36b2f4e"
  # 64 bytes, not 32. This file is parameterized across all four suites, and RFC 9807 section 6.3
  # specifies an Nh-byte OPRF seed — Nh is 32 on P-256 but 48 on P-384 and 64 on P-521 and
  # ristretto255, so the previous 32-byte value was short on three of the four. 64 is Nh's maximum
  # across the supported suites, so one value is conformant everywhere.
  oprf-seed-hex: "20aa81d9ea8bf9de0877e02bc9d6adf4ef9d6bd50bbb515c84d78d1f246f49a3b7c1e4a9f30d2856ac47e91b5d8f0632e14ca7d95b8036fe2417ac0d9b53e8f6"
  jwt-secret-hex: "04fb50080c93c055a4195cb535c9311381975a94eaaac8aeef3df0776aca4f6d"
  oprf-processor-id: "integration-processor"
  # VOPRF and POPRF master keys. Fixed rather than ephemeral, and that is the point: a verifiable
  # mode's value is that the client pins the server's public key, so a key regenerated on restart
  # would make every pinned copy stale. The tests derive the keys they pin from these same values.
  #
  # Two different secrets, because RFC 9497 puts the mode byte in every domain-separation tag and
  # the section 7.2.3 static Diffie-Hellman budget is per-key — and POPRF exposes an inversion
  # oracle where the other modes expose a multiplication one.
  voprf-master-key-hex: "4a1f9c3e7b25d8064f13a9e5c72b8d40e916f3a7c5b2d894e0163a7fc9d5b2e8"
  poprf-master-key-hex: "7d2e5b91c4f38a06e7b1d945c83f2b60a94e7d31f85c206b3e7a9d148f5c2b30"
  jwt-ttl-seconds: 3600
  jwt-issuer: "hofmann-integration"
